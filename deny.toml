# cargo-deny configuration: which dependencies the app may use.
# Runs in CI on every change. See docs/decisions/0004-gpl-license.md.

[graph]
all-features = true

[advisories]
version = 2
# Known security vulnerabilities in any dependency fail the build.
yanked = "deny"
# "Unmaintained" notices (not vulnerabilities) accepted one by one, with a
# reason. Remove an entry as soon as the library using it moves on.
# See docs/decisions/0008-window-and-panels.md.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: macro helper used only at compile time by egui_dock; no replacement upstream yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: font reading inside winit's Linux window decorations; no replacement upstream yet" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux screen-reader support inside egui (accesskit, through zbus); unmaintained, not a vulnerability, no replacement upstream yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: as zvariant, Linux screen-reader support inside egui" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: as zvariant, Linux screen-reader support inside egui" },
]

[licenses]
version = 2
# The app itself is GPL-3.0-or-later, but every dependency must be
# permissive: that keeps future options such as dual licensing open.
# Adding a license here needs a pull request that explains why.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # Boost license: permissive, used by some platform libraries.
    "BSL-1.0",
    # Fonts embedded in the program allow embedding and redistribution with
    # their license text; see licenses/.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
# Allowed licenses no current dependency uses are fine, not a warning.
unused-allowed-license = "allow"

[licenses.private]
# The app's own crates are not published, so they need no license check.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or unknown registries.
unknown-registry = "deny"
unknown-git = "deny"
