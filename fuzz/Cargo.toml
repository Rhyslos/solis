# Fuzz targets for every reader of a file a project can ship
# (decision 0042). Not part of the workspace: they need cargo-fuzz.
#
#   cargo fuzz run save_game        (nightly, as CI's weekly job does)
#
# See fuzz/README.md.
[package]
name = "solis-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
# The two libraries only the fuzzers use, each pinned to one exact version:
# no lock file is kept here to hold them (see [workspace] below), and
# Dependabot doesn't read this folder. A person changes them, with
# cargo-fuzz and its compiler (.github/workflows/README.md, "Tools the
# workflows install"). arbitrary is named only to pin it: libfuzzer-sys
# uses it, no target does.
libfuzzer-sys = "=0.4.13"
arbitrary = "=1.5.0"
editor = { path = "../crates/editor" }
input = { path = "../crates/input" }
area = { path = "../crates/area" }
mesh = { path = "../crates/mesh" }
assets = { path = "../crates/assets" }
asset_db = { path = "../crates/asset_db" }
script = { path = "../crates/script" }
reflect = { path = "../crates/reflect" }
updater = { path = "../crates/updater" }
sound = { path = "../crates/sound" }
animation = { path = "../crates/animation" }
ui = { path = "../crates/ui" }
tiles = { path = "../crates/tiles" }

# Its own workspace, so the engine's never builds it. Its Cargo.lock isn't
# kept in the repository: tools/ci/fuzz-lock.sh writes it from the main
# one before the fuzzers are built, so they build the library versions the
# program ships (README.md, The lock file).
[workspace]

# The same stand-in the engine uses for Kira's triple_buffer
# (docs/dependencies.md, Patches).
[patch.crates-io]
triple_buffer = { path = "../patches/triple_buffer" }

[profile.release]
debug = 1

# What every target shares (src/lib.rs): named for its job, not the
# program, so the targets never spell the program's name.
[lib]
name = "fuzz_support"
path = "src/lib.rs"
doc = false
bench = false

[[bin]]
name = "save_game"
path = "fuzz_targets/save_game.rs"
test = false
doc = false
bench = false

