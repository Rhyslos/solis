[package]
name = "updater"
description = "Finds, downloads and checks new builds of the editor from GitHub, and starts their installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
# Layer 3 (app): only the program itself uses it; games never do.
[package.metadata.architecture]
layer = 3

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
log.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
