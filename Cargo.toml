[workspace]
resolver = "3"
members = ["crates/*", "tools/layer-check"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Rhyslos/solis"
authors = ["Rhyslos"]
publish = false

# Solis's own crates, so any crate can depend on another by name.
# Which crate may depend on which is decided by layers (see ARCHITECTURE.md)
# and enforced by the test in tools/layer-check.
[workspace.dependencies]
assets = { path = "crates/assets" }
render = { path = "crates/render" }
editor = { path = "crates/editor" }
reflect = { path = "crates/reflect" }
area = { path = "crates/area" }
asset_db = { path = "crates/asset_db" }
world = { path = "crates/world" }
script = { path = "crates/script" }
physics = { path = "crates/physics" }
input = { path = "crates/input" }
updater = { path = "crates/updater" }

# Outside libraries. Every one must have a licence compatible with MIT,
# checked by `cargo deny check` (see deny.toml and decision 0007).
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
glam = { version = "0.34", features = ["serde", "bytemuck"] }
# Simplifies meshes into levels of detail (decision 0032).
meshopt = "0.7"
# Must match the wgpu version eframe uses (one GPU device is shared).
wgpu = "30.0"
bytemuck = { version = "1.25", features = ["derive"] }
# The window and frame loop (winit + wgpu underneath).
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
# Dockable panels (decision 0004).
egui_dock = { version = "0.21", features = ["serde"] }
# Reading glTF models: the JSON and binary layout only. Buffers and
# images are read by Solis itself, with size limits (crates/assets).
gltf = { version = "1.4", default-features = false, features = ["names", "utils", "KHR_lights_punctual"] }
# Decoding PNG and JPEG textures, with limits on size and memory.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Data inside glTF files ("data:" addresses).
base64 = "0.23"
percent-encoding = "2.3"
# The Open file window (Windows; elsewhere through the desktop portal).
rfd = "0.17"
# The game's storage while it runs (decision 0024).
hecs = "0.11"
# Physics, in its strict mode: the same result on every PC (decision
# 0036). Not `parallel`: its order of work isn't fixed.
rapier3d = { version = "0.36", features = ["enhanced-determinism"] }
# Compact binary for physics in save games (decision 0038).
# Gamepads (decision 0037), on Windows.
gilrs = "0.11"
# The job system: work spread over every core (decision 0031).
rayon = "1.12"
# Messages from the libraries (the GPU layer, say), shown in the Console.
log = "0.4"
# The local time on console messages.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Updates (decision 0043): asking GitHub for the newest build and
# downloading it, over HTTPS checked by the system's own certificates
# (no bundled certificate list), and checking the download's SHA-256.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
sha2 = "0.11"
serde_json = "1.0"
# Development only.
egui_kittest = "0.36"
pollster = "1.0"
ron = "0.12"
# Watching the project folder for changed files (decision 0021).
notify = "8.2"
# Game code (decision 0028): the Lust compiler as a library, pinned to a
# commit of Lust's main branch until its tag exists (then `tag =
# "v2.0.0-alpha.33"`); without default features it needs only Rust's own
# library. Lust and Lua run in Luau.
lust = { git = "https://github.com/Rhyslos/Lust", rev = "a60cf875569b753e1374d9ea163d9759013018ae", default-features = false }
# Its Luau source is held at 0.740 in Cargo.lock (luau0-src
# 0.22.0+luau740): with 0.744, mlua 0.12.2 can't start a Luau at all
# ("Error configuring Luau"). Update the two together.
mlua = { version = "0.12", features = ["luau"] }
notify-debouncer-mini = "0.7"
# Deleting from the Library moves files to the Recycle Bin, so nothing is
# lost by accident.
trash = "5.2"
# Opening a file in its own program, or a folder in the system's file
# browser, from the Library.
opener = "0.9"
# Development only: whole-game invariant tests (decision 0042).
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
# No unsafe code. "deny" rather than "forbid" so that a reviewed exception,
# with its own decision record, can allow it on one small module.
unsafe_code = "deny"
# Every public item must be documented.
missing_docs = "deny"
unreachable_pub = "warn"
# The fuzz targets (fuzz/, decision 0042) build Solis with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
# Library code never crashes on purpose. Tests are exempt through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep debug builds usable: optimise dependencies even in development, so
# the editor stays smooth while working on it.
[profile.dev.package."*"]
opt-level = 2
