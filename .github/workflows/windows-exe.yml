# Builds the program and its installer for Windows on every merge into
# main, and publishes them as a GitHub release that installed copies update
# from.
#
# Decision 0010 (docs/decisions/0010-windows-exe-on-merge.md) set when it
# runs; decision 0043 (docs/decisions/0043-installed-and-updated-from-github.md)
# added the installer and the releases:
#
# - runs when code is merged into main (never for documentation alone),
#   and by hand;
# - builds only the program: no tests (the pull request already ran them);
# - stamps the program with its build number (this workflow's run number),
#   which installed copies compare with the newest release's;
# - makes the installer with Inno Setup (installer/setup.iss);
# - publishes release `build-<number>` with the installer and its SHA-256,
#   keeping the newest ten.
name: Windows EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer merge cancels an unfinished build of an older one.
concurrency:
  group: windows-exe
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The exact Inno Setup that makes the installer every installed copy
  # downloads and runs. GitHub's Windows machines come with one, but which
  # one changes when they are rebuilt, so the step below checks it and
  # installs this version when it is another. Dependabot doesn't update
  # this (or cargo-about's version below): a person does, in a pull request
  # of its own (.github/workflows/README.md, "Tools the workflows install").
  INNO_SETUP_VERSION: "6.7.1"

jobs:
  exe:
    name: Build and publish the Windows program
    runs-on: windows-latest
    # A stuck build stops here instead of using up hours of the allowance.
    timeout-minutes: 60
    permissions:
      # Publishing the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The name, ID and repository come from branding.rs, so renaming the
      # program changes them here too (RENAMING.md).
      - name: Read the program's name
        id: brand
        shell: bash
        run: |
          read_const() { sed -n "s/^pub const $1: &str = \"\(.*\)\";/\1/p" crates/app/src/branding.rs; }
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          {
            echo "name=$(read_const APP_NAME)"
            echo "id=$(read_const APP_ID)"
            echo "repo=$(read_const UPDATE_REPO)"
            echo "installer=$(read_const INSTALLER_NAME)"
            echo "version=$version"
            echo "build=${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p app
        env:
          # Stamped into the program: what it compares updates against.
          BUILD_NUMBER: ${{ steps.brand.outputs.build }}
      # The program and its licences side by side in one flat folder, so
      # the downloaded zip opens straight to the program. The user guide
      # goes beside them, where the editor's Documentation button looks
      # for it (decision 0112): the copy kept in docs/user-guide, which the
      # pull request's checks proved is the manual as it is now.
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ steps.brand.outputs.id }}.exe" LICENSE dist/
          cp -r licenses dist/licenses
          rm dist/licenses/third-party.hbs
          mkdir dist/user-guide
          cp docs/user-guide/index.html dist/user-guide/
          test -s dist/user-guide/index.html
      # The libraries built into the program, with their copyright notices
      # and licences, as their licences ask of every copy (decision 0044).
      # From the exact libraries in this build, for Windows.
      - name: Third-party notices
        shell: bash
        run: |
          cargo install cargo-about@0.9.2 --locked --features cli
          cargo about generate -c about.toml licenses/third-party.hbs \
            -m crates/app/Cargo.toml -o dist/THIRD-PARTY-NOTICES.txt
          test -s dist/THIRD-PARTY-NOTICES.txt
      # Only the pinned Inno Setup may make the installer. The compiler is
      # asked what it is before it is used: its file carries no version
      # number, and it prints one only when it compiles, so it checks
      # (without building, /O-) a script of four lines. Any other answer,
      # or none, installs the pinned version from Chocolatey and asks
      # again; if that still isn't it, the build stops here.
      - name: Make the installer
        shell: pwsh
        run: |
          $want = $env:INNO_SETUP_VERSION
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          function Get-InnoSetupVersion {
            if (-not (Test-Path $iscc)) { return "missing" }
            $probe = Join-Path $env:RUNNER_TEMP "inno-setup-version.iss"
            Set-Content -Path $probe -Value '[Setup]', 'AppName=Version check', 'AppVersion=0', 'DefaultDirName={autopf}\Version check'
            $said = & $iscc /O- $probe | Select-String -Pattern 'Compiler engine version: Inno Setup (\d+(\.\d+)+)' | Select-Object -First 1
            if ($said) { return $said.Matches[0].Groups[1].Value }
            return "unknown"
          }
          $have = Get-InnoSetupVersion
          if ($have -ne $want) {
            Write-Host "Inno Setup on this machine: $have. Installing $want."
            choco install innosetup "--version=$want" --allow-downgrade --no-progress -y
            Write-Host "Chocolatey finished with exit code $LASTEXITCODE."
            $have = Get-InnoSetupVersion
          }
          if ($have -ne $want) {
            Write-Host "::error::The installer is made with Inno Setup $want only, and the compiler at '$iscc' is: $have. Nothing was built. The lines above say what Chocolatey did; if it no longer has innosetup $want, choose a new version in INNO_SETUP_VERSION (windows-exe.yml)."
            exit 1
          }
          Write-Host "Making the installer with Inno Setup $have."
          & $iscc /Qp `
            "/DAppName=${{ steps.brand.outputs.name }}" `
            "/DAppId=${{ steps.brand.outputs.id }}" `
            "/DRepo=${{ steps.brand.outputs.repo }}" `
            "/DAppVersion=${{ steps.brand.outputs.version }}" `
            "/DBuild=${{ steps.brand.outputs.build }}" `
            "/DSource=$PWD\dist" `
            "/DOutput=$PWD\setup" `
            installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksum
        shell: bash
        working-directory: setup
        run: sha256sum "${{ steps.brand.outputs.installer }}" > "${{ steps.brand.outputs.installer }}.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.brand.outputs.id }}-windows
          path: |
            dist/
            setup/
          if-no-files-found: error
          retention-days: 30
      # Only main's builds are published: they're what copies update to.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ steps.brand.outputs.build }}
          NAME: ${{ steps.brand.outputs.name }}
          BUILD: ${{ steps.brand.outputs.build }}
        run: |
          # What the build brings, as the launcher's Updates page shows it
          # (decision 0086): a merge's pull request title (the first line
          # of its message's body), or the commit's own subject.
          subject=$(git log -1 --format=%s)
          title=$(git log -1 --format=%b | sed -n '/./{p;q;}')
          case "$subject" in
            "Merge pull request"*) [ -n "$title" ] && subject="$title" ;;
          esac
          printf 'Build %s of %s, from %s:\n\n> %s\n\nInstall it with the setup file below. Installed copies update to it by themselves.\n' \
            "$BUILD" "$NAME" "$GITHUB_SHA" "$subject" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" setup/* --clobber
          else
            gh release create "$TAG" setup/* --title "$NAME build $BUILD" \
              --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
      - name: Keep the newest ten releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^build-[0-9]+$' | sort -t- -k2 -n -r | tail -n +11 \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
