# Builds solis.exe for Windows, ready to download from the Actions tab.
# Decision 0010 (docs/decisions/0010-windows-exe-on-merge.md), which
# loosens decision 0001 for this one build:
#
# - runs when code is merged into main (never for documentation alone),
#   and by hand;
# - builds only the program: no tests (the pull request already ran them)
#   and no installer.
name: Windows EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer merge cancels an unfinished build of an older one.
concurrency:
  group: windows-exe
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  exe:
    name: Build solis.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p app
      # The program and its licences side by side in one flat folder, so
      # the downloaded zip opens straight to solis.exe. The file name is
      # the program's (APP_ID in crates/app/src/branding.rs).
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/solis.exe LICENSE dist/
          cp -r licenses dist/licenses
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: solis-windows
          path: dist/
          if-no-files-found: error
          retention-days: 30
