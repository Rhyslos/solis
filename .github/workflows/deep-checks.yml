# The weekly deep checks (decision 0042, the hardening milestone): what is
# too slow for every pull request.
#
# - Fuzzing: every reader of a file a project can ship (fuzz/README.md),
#   each for a time box, starting from fuzz/seeds. A crash or hang is
#   uploaded and opens an issue.
# - The whole-game invariant tests, with many more games than a pull
#   request runs (PROPTEST_CASES). A failure opens an issue with the
#   smallest game that shows it.
#
# Linux only: the readers and the game are the same code on every system.
name: Deep checks

on:
  schedule:
    # Sundays at 03:41 UTC.
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to fuzz each target"
        default: "20"

permissions:
  contents: read

concurrency:
  group: deep-checks
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - save_game
          - recording
          - input_actions
          - area_file
          - model
          - import_cache
          - sidecar
          - project_file
          - game_code
          - update_answer
          - sound_file
          - sound_event
          - mixer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      # The sound crate builds against ALSA on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: fuzz
        env:
          MINUTES: ${{ github.event.inputs.minutes || '20' }}
        run: |
          mkdir -p "corpus/${{ matrix.target }}" "artifacts/${{ matrix.target }}"
          cargo +nightly fuzz run -O "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" -- \
            -max_total_time=$((MINUTES * 60)) -timeout=45 -rss_limit_mb=4096 \
            -max_len=1048576 -print_final_stats=1
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --label bug \
            --title "Fuzzing found a problem: ${{ matrix.target }}" \
            --body "The weekly deep checks' fuzzer for \`${{ matrix.target }}\` found an input that crashes or hangs Solis. The input is attached to the run as the \`fuzz-${{ matrix.target }}\` artifact: $RUN. Replay it with \`cargo fuzz run ${{ matrix.target }} <file>\` (fuzz/README.md), fix it, and add a regression test."

  invariants:
    name: Whole-game invariants, many games
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Play many games
        env:
          PROPTEST_CASES: "1000"
        # GitHub's bash stops at the first failing pipeline (pipefail).
        run: |
          cargo test --release --locked -p editor invariant_tests 2>&1 | tee invariants.txt
          cargo test --release --locked -p physics a_crowd 2>&1 | tee -a invariants.txt
      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly deep checks played a game that broke one of the whole-game rules (ARCHITECTURE.md, Checks). The smallest game that shows it:"
            echo
            echo '```'
            grep -A40 "minimal failing input" invariants.txt | head -60
            echo '```'
            echo
            echo "Run: $RUN. Add the game to the test's proptest-regressions file (or as a test), then fix it."
          } > body.md
          gh issue create --label bug --title "A whole-game rule broke in the weekly run" --body-file body.md
