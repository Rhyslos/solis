# Checks for pull requests. The repo is private and Actions minutes are
# limited, so this follows decision 0001 (docs/decisions/0001-*.md):
#
# - runs only on pull requests that are ready for review, and by hand;
#   never on every push, never on a schedule;
# - skips changes that touch only documentation;
# - cheap checks first: the build and tests run only if they pass;
# - Linux only, unless run by hand with "all platforms" or for a release tag.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Also build and test on Windows and macOS"
        type: boolean
        default: false

# Read-only by default; no job here needs to write anything.
permissions:
  contents: read

# A newer run cancels an older one for the same pull request or branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Formatting, lints and licences
    # Draft pull requests don't build.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  test:
    name: Tests and documentation (Linux)
    needs: checks
    runs-on: ubuntu-latest
    env:
      # Broken links or malformed docs fail the build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo doc --workspace --no-deps --locked

  window:
    name: Window and GPU tests (Linux)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A virtual screen, a software GPU driver, and tools to click and take
      # screenshots.
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick mesa-vulkan-drivers libxkbcommon-x11-0
      - run: cargo build --locked -p app
      # GPU rendering tests: here a missing GPU is a failure, not a skip.
      - run: cargo test --locked -p render --test gpu
        env:
          REQUIRE_GPU: "1"
      # The window title starts with the program's name (APP_NAME in
      # crates/app/src/branding.rs).
      - run: xvfb-run -s "-screen 0 1440x900x24" tools/smoke/window-smoke.sh target/debug/solis "Solis" smoke-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: window-screenshots
          path: smoke-output/
          retention-days: 14

  other-platforms:
    name: Tests (${{ matrix.os }})
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.all_platforms)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo build --release --locked -p app
