# Checks for pull requests and merges, as decision 0018 sets out
# (docs/decisions/0018-checks-for-a-public-repo.md). The repository is
# public, so GitHub's machines are free:
#
# - runs on every update to a pull request that isn't a draft, on every
#   merge into main, for release tags, and by hand;
# - skips changes that touch only documentation;
# - cheap checks first: the build and tests run only if they pass;
# - tests on Linux and on Windows. Solis is made for Windows only
#   (decision 0012); the Linux runs are extra checks (a second GPU driver,
#   and the window test, which needs X11 tools).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
  workflow_dispatch:

# Read-only by default; no job here needs to write anything.
permissions:
  contents: read

# A newer run cancels an older one for the same pull request or branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Formatting, lints and licences
    # Draft pull requests don't build.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # A stuck step stops here instead of running for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  test:
    name: Tests and documentation (Linux)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Broken links or malformed docs fail the build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        run: tools/ci/failed-tests.sh test-output.txt
      - run: cargo doc --workspace --no-deps --locked

  window:
    name: Window and GPU tests (Linux)
    needs: checks
    runs-on: ubuntu-latest
    # A stuck step stops here instead of running for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # A virtual screen, a software GPU driver, and tools to click and take
      # screenshots.
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick mesa-vulkan-drivers libxkbcommon-x11-0
      - run: cargo build --locked -p app
      # GPU rendering tests: here a missing GPU is a failure, not a skip.
      - run: cargo test --locked -p render --test gpu
        timeout-minutes: 10
        env:
          REQUIRE_GPU: "1"
      # The window title starts with the program's name (APP_NAME in
      # crates/app/src/branding.rs).
      # The sample model the window test imports.
      - run: mkdir -p smoke-output && cargo run --locked -q -p assets --example sample -- smoke-output/sample.glb
      - run: xvfb-run -s "-screen 0 1440x900x24" tools/smoke/window-smoke.sh target/debug/solis "Solis" smoke-output
        env:
          SAMPLE_MODEL: smoke-output/sample.glb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: window-screenshots
          path: smoke-output/
          retention-days: 14

  windows:
    name: Tests and GPU tests (Windows)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Every test, with the GPU tests on Direct3D 12, the graphics path
      # Solis ships on, through Windows' software renderer (WARP). A
      # missing GPU is a failure here, not a skip.
      - run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          REQUIRE_GPU: "1"
          WGPU_BACKEND: dx12
      # Which tests failed and why, as one annotation on the run.
      - if: failure()
        shell: bash
        run: tools/ci/failed-tests.sh test-output.txt
