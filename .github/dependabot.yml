# Weekly pull requests for outdated dependencies (decision 0018), grouped
# so they arrive as one pull request per kind rather than dozens.
#
# Only the main Cargo.lock is listed, on purpose. The fuzzers have a lock
# file of their own (fuzz/Cargo.lock), and it must follow the main one
# exactly, never move by itself: a check on every pull request fails when
# the two differ (tools/ci/fuzz-lock-check.sh). So when a pull request
# from here changes a library the fuzzers also build, that check fails
# until someone runs `tools/ci/fuzz-lock-check.sh --fix` on its branch and
# commits fuzz/Cargo.lock. The same command brings the two libraries only
# the fuzzers use to their newest versions (fuzz/README.md, The lock
# file). tools/storage-bench has a lock file too: it is run by hand only,
# to check one decision again, and nothing updates it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # egui and the crates built on it only work at the same version, so
      # they come together, whatever kind of update. egui_dock follows
      # egui a little later: until it supports a new egui, this pull
      # request fails and waits.
      egui:
        patterns: ["egui", "egui_*", "egui-*", "eframe", "epaint", "emath", "ecolor"]
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
