# The benchmark behind decision 0024: hecs against a small storage of
# Solis's own, at the scale target (DESIGN.md §2). Not part of the
# workspace, so hecs never enters Solis's own build.
#
#     cargo run --release --manifest-path tools/storage-bench/Cargo.toml

[package]
name = "storage-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
hecs = "0.11"
glam = "0.34"
